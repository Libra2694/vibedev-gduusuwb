<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeCloset // Weather Outfit Rater</title>
    <style>
        :root {
            --bg: #09090b; --card: rgba(20,20,23,0.7); --border: rgba(255,255,255,0.06);
            --text: #f4f4f5; --text-mut: #a1a1aa;
            --indigo: #6366f1; --teal: #14b8a6; --rose: #f43f5e;
            --glow: rgba(99,102,241,0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body {
            background-color: var(--bg); color: var(--text); min-height: 100vh; padding: 1.5rem 1rem;
            background-image: 
                radial-gradient(circle at 10% 10%, var(--glow) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(20,184,166,0.06) 0%, transparent 40%);
            display: flex; justify-content: center; transition: background-image 0.5s ease;
        }
        /* Dynamic ambient weather glows */
        body.hot { --glow: rgba(245,158,11,0.12); }
        body.cold { --glow: rgba(14,165,233,0.12); }
        body.mild { --glow: rgba(16,185,129,0.1); }

        .c { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 1.25rem; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.8rem; flex-wrap: wrap; gap: 1rem; }
        .lg { display: flex; align-items: center; gap: 0.5rem; }
        .lg h1 { font-size: 1.4rem; font-weight: 800; background: linear-gradient(135deg, #a5b4fc, #2dd4bf); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .tgl { background: rgba(255,255,255,0.04); border: 1px solid var(--border); padding: 0.15rem; border-radius: 99px; display: flex; position: relative; cursor: pointer; width: 120px; user-select: none; }
        .tb { flex: 1; text-align: center; padding: 0.3rem; font-size: 0.7rem; font-weight: 700; z-index: 2; color: var(--text-mut); }
        .tb.active { color: #fff; }
        .ts { position: absolute; top: 0.15rem; left: 0.15rem; width: calc(50% - 0.15rem); height: calc(100% - 0.3rem); background: linear-gradient(135deg, var(--indigo), rgba(99,102,241,0.8)); border-radius: 99px; transition: transform 0.2s ease; z-index: 1; }
        .tgl.f .ts { transform: translateX(100%); background: linear-gradient(135deg, var(--teal), rgba(20,184,166,0.8)); }
        
        .grid { display: grid; grid-template-columns: 1fr; gap: 1.25rem; }
        @media (min-width: 800px) { .grid { grid-template-columns: 320px 1fr; } }
        
        .card { background: var(--card); border: 1px solid var(--border); backdrop-filter: blur(10px); border-radius: 0.75rem; padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; }
        .card-title { font-size: 0.9rem; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-mut); }
        
        .ig { display: flex; flex-direction: column; gap: 0.4rem; }
        .ih { display: flex; justify-content: space-between; align-items: center; }
        .il { font-size: 0.7rem; color: var(--text-mut); font-weight: 700; text-transform: uppercase; }
        .iw { display: flex; align-items: center; background: rgba(0,0,0,0.25); border: 1px solid var(--border); border-radius: 0.3rem; padding: 0.2rem 0.5rem; width: 100%; }
        .iw input, .iw select { background: transparent; border: none; color: #fff; width: 100%; font-size: 0.85rem; font-weight: 700; outline: none; }
        .iw select option { background: var(--bg); color: #fff; }
        .iu { font-size: 0.75rem; color: var(--text-mut); font-weight: 700; }
        
        .btn-rate { background: linear-gradient(135deg, var(--indigo), var(--teal)); border: none; border-radius: 0.4rem; padding: 0.75rem; color: #fff; font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: opacity 0.2s, transform 0.1s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .btn-rate:hover { opacity: 0.9; }
        .btn-rate:active { transform: scale(0.98); }
        
        /* Verdict Screen */
        .res-panel { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; border: 1px dashed rgba(255,255,255,0.08); border-radius: 0.5rem; background: rgba(0,0,0,0.15); min-height: 180px; text-align: center; position: relative; overflow: hidden; }
        .scanner { border: 4px solid rgba(255,255,255,0.05); border-top-color: var(--indigo); border-radius: 50%; width: 45px; height: 45px; animation: spin 0.6s linear infinite; display: none; }
        
        .score-circle { width: 70px; height: 70px; border-radius: 50%; border: 4px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 800; margin-bottom: 0.75rem; transition: border-color 0.3s; }
        .score-circle.bad { border-color: var(--rose); color: var(--rose); }
        .score-circle.mid { border-color: #f59e0b; color: #f59e0b; }
        .score-circle.good { border-color: var(--teal); color: var(--teal); }

        .verdict-title { font-size: 1rem; font-weight: 700; margin-bottom: 0.25rem; color: #fff; }
        .verdict-text { font-size: 0.8rem; color: var(--text-mut); line-height: 1.4; max-width: 400px; }
        
        .history-title { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--text-mut); margin-top: 0.5rem; }
        .history-list { display: flex; flex-direction: column; gap: 0.35rem; max-height: 200px; overflow-y: auto; }
        .history-list::-webkit-scrollbar { width: 3px; }
        .history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        .history-item { background: rgba(255,255,255,0.015); border: 1px solid rgba(255,255,255,0.02); border-radius: 0.4rem; padding: 0.5rem 0.75rem; display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; }
        .history-left { display: flex; flex-direction: column; gap: 0.15rem; }
        .history-outfit { font-size: 0.65rem; color: var(--text-mut); }
        .history-badge { padding: 0.15rem 0.4rem; border-radius: 99px; font-weight: 700; font-size: 0.65rem; }
        .history-badge.bad { background: rgba(244,63,94,0.1); color: var(--rose); }
        .history-badge.mid { background: rgba(245,158,11,0.1); color: #f59e0b; }
        .history-badge.good { background: rgba(20,184,166,0.1); color: var(--teal); }
        
        .wn { background: rgba(244,63,94,0.05); border: 1px solid rgba(244,63,94,0.2); border-radius: 0.4rem; padding: 0.4rem 0.6rem; display: none; align-items: center; gap: 0.4rem; font-size: 0.7rem; color: #fca5a5; }

        @keyframes spin { to { transform: rotate(360deg); } }
        footer { font-size: 0.65rem; color: var(--text-mut); border-top: 1px solid rgba(255,255,255,0.05); padding-top: 0.6rem; display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <div class="c" id="app">
        <header>
            <div class="lg">
                <div class="lgi">🧥</div>
                <div>
                    <h1>VibeCloset</h1>
                    <p>Weather Outfit Rater</p>
                </div>
            </div>
            <div class="tgl" id="unitToggle" onclick="toggleUnit()">
                <div class="ts"></div>
                <div class="tb active" id="btnC">CELSIUS</div>
                <div class="tb" id="btnF">FAHRENHEIT</div>
            </div>
        </header>

        <div class="grid">
            <!-- Inputs Card -->
            <div class="card">
                <div class="card-title">⚙️ CONFIGURATION</div>
                <div class="wn" id="warnBox">⚠️ <span id="warnText"></span></div>
                
                <!-- Temperature -->
                <div class="ig">
                    <label class="il" for="tempInput">Outdoor Temperature</label>
                    <div class="iw">
                        <input type="number" id="tempInput" placeholder="Enter temp..."><span class="iu" id="tempUnit">°C</span>
                    </div>
                </div>

                <!-- Top Layer -->
                <div class="ig">
                    <label class="il" for="topSelect">Top Layer</label>
                    <div class="iw">
                        <select id="topSelect">
                            <option value="tshirt">👕 T-Shirt</option>
                            <option value="jacket">🧥 Light Jacket</option>
                            <option value="coat">🧥 Heavy Coat</option>
                        </select>
                    </div>
                </div>

                <!-- Bottom Layer -->
                <div class="ig">
                    <label class="il" for="bottomSelect">Bottom Layer</label>
                    <div class="iw">
                        <select id="bottomSelect">
                            <option value="shorts">🩳 Shorts</option>
                            <option value="jeans">👖 Jeans</option>
                            <option value="thermal">👖 Thermal Pants</option>
                        </select>
                    </div>
                </div>

                <!-- Footwear -->
                <div class="ig">
                    <label class="il" for="footSelect">Footwear</label>
                    <div class="iw">
                        <select id="footSelect">
                            <option value="sandals">🩴 Sandals</option>
                            <option value="sneakers">👟 Sneakers</option>
                            <option value="boots">🥾 Boots</option>
                        </select>
                    </div>
                </div>

                <button class="btn-rate" onclick="rateOutfit()">🔍 Rate My Outfit</button>
            </div>

            <!-- Dashboard Output -->
            <div class="c" style="gap: 1.25rem;">
                <div class="card">
                    <div class="card-title">📊 RATING RESULTS</div>
                    <div class="res-panel" id="resPanel">
                        <div class="scanner" id="spinner"></div>
                        <div id="resContent" style="display: flex; flex-direction: column; align-items: center;">
                            <div style="color: var(--text-mut); font-size: 0.8rem; font-style: italic;">Enter temperature and click "Rate My Outfit" to start scanning.</div>
                        </div>
                    </div>
                </div>

                <!-- History Card -->
                <div class="card">
                    <div class="history-title">🕒 Rating History (Last 5)</div>
                    <div class="history-list" id="historyContainer">
                        <div style="color: var(--text-mut); font-size: 0.75rem; font-style: italic; padding: 0.5rem 0;">No previous outfit rating history found.</div>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <div>VibeCloset &bull; SPA</div>
            <div>Built for Vibedev Duel</div>
        </footer>
    </div>

    <script>
        let unit = 'C';
        const $ = id => document.getElementById(id);
        const els = {
            toggle: $('unitToggle'), btnC: $('btnC'), btnF: $('btnF'),
            temp: $('tempInput'), uLbl: $('tempUnit'),
            top: $('topSelect'), bottom: $('bottomSelect'), foot: $('footSelect'),
            spinner: $('spinner'), resContent: $('resContent'),
            history: $('historyContainer'), wB: $('warnBox'), wT: $('warnText')
        };

        let historyLog = JSON.parse(localStorage.getItem('outfit_history')) || [];

        // Optimal weather range specifications (Celsius)
        const rules = {
            top: {
                tshirt: { min: 23, max: 50, label: "T-Shirt" },
                jacket: { min: 14, max: 23, label: "Light Jacket" },
                coat: { min: -50, max: 14, label: "Heavy Coat" }
            },
            bottom: {
                shorts: { min: 21, max: 50, label: "Shorts" },
                jeans: { min: 9, max: 21, label: "Jeans" },
                thermal: { min: -50, max: 9, label: "Thermal Pants" }
            },
            foot: {
                sandals: { min: 22, max: 50, label: "Sandals" },
                sneakers: { min: 9, max: 22, label: "Sneakers" },
                boots: { min: -50, max: 9, label: "Boots" }
            }
        };

        function toggleUnit() {
            const rawVal = parseFloat(els.temp.value);
            const isC = unit === 'C';
            unit = isC ? 'F' : 'C';
            
            els.toggle.classList.toggle('f', isC);
            els.btnC.classList.toggle('active', !isC);
            els.btnF.classList.toggle('active', isC);
            els.uLbl.innerText = '°' + unit;

            if (!isNaN(rawVal)) {
                // Convert value
                els.temp.value = isC 
                    ? Math.round(rawVal * 1.8 + 32)
                    : Math.round((rawVal - 32) / 1.8);
            }
            updateAmbientGlow();
        }

        function updateAmbientGlow() {
            const tempVal = parseFloat(els.temp.value);
            document.body.className = '';
            if (isNaN(tempVal)) return;

            let tempC = unit === 'C' ? tempVal : (tempVal - 32) / 1.8;
            if (tempC >= 28) document.body.className = 'hot';
            else if (tempC <= 12) document.body.className = 'cold';
            else document.body.className = 'mild';
        }

        els.temp.addEventListener('input', updateAmbientGlow);

        function rateOutfit() {
            const tempVal = parseFloat(els.temp.value);
            if (isNaN(tempVal)) {
                els.wT.innerText = "Please enter today's outdoor temperature.";
                els.wB.style.display = 'flex';
                return;
            }
            els.wB.style.display = 'none';

            // Show Scanning animation
            els.spinner.style.display = 'block';
            els.resContent.style.display = 'none';

            setTimeout(() => {
                els.spinner.style.display = 'none';
                els.resContent.style.display = 'flex';

                let tempC = unit === 'C' ? tempVal : (tempVal - 32) / 1.8;
                
                const scoreItem = (val, opt) => {
                    const r = rules[opt][val];
                    if (tempC >= r.min && tempC <= r.max) return 10;
                    const dev = tempC < r.min ? r.min - tempC : tempC - r.max;
                    return Math.max(1, 10 - Math.round(dev * 0.5));
                };

                const scoreTop = scoreItem(els.top.value, 'top');
                const scoreBottom = scoreItem(els.bottom.value, 'bottom');
                const scoreFoot = scoreItem(els.foot.value, 'foot');

                const totalScore = Math.round((scoreTop + scoreBottom + scoreFoot) / 3);

                // Build verdict and fun text
                let title = "", desc = "";
                
                if (totalScore >= 9) {
                    title = "Perfect Match! 🌟";
                    desc = tempC >= 18 
                        ? "Styling and perfectly comfortable for today's weather! 😎"
                        : "Perfect choice for a brisk walk! Keeps you cozy and warm. 🍂";
                } else if (totalScore >= 7) {
                    title = "Great Fit! 👌";
                    desc = "Very good comfort score. Keep an eye on the wind, but you're set to go!";
                } else if (totalScore >= 5) {
                    title = "Average Choice 🌤️";
                    desc = "Not bad, but you might feel a bit of a breeze or start stuffing up later. Consider a quick layer adjustment.";
                } else if (totalScore >= 3) {
                    title = "Fashion Alert 🧣";
                    desc = "A bit mismatched. You will likely feel uncomfortable in this setup. Swapping an item is highly recommended.";
                } else {
                    title = "Absolute Disaster! 💀";
                    // Custom hyper-specific comments
                    if (tempC >= 25) {
                        desc = "You'll be sweating in 10 minutes 🥵! Heavy layers in this heat is a total fashion crime.";
                    } else {
                        desc = "Frostbite alert! You'll be shivering in no time 🥶. Go grab some heavier gear immediately.";
                    }
                }

                // Render score UI
                let badgeClass = totalScore <= 4 ? 'bad' : (totalScore <= 7 ? 'mid' : 'good');
                els.resContent.innerHTML = `
                    <div class="score-circle ${badgeClass}">${totalScore}/10</div>
                    <div class="verdict-title">${title}</div>
                    <div class="verdict-text">${desc}</div>
                `;

                // Log into history
                const itemLabel = (opt, val) => rules[opt][val].label;
                const newLog = {
                    score: totalScore,
                    temp: Math.round(tempVal) + '°' + unit,
                    outfit: `${itemLabel('top', els.top.value)}, ${itemLabel('bottom', els.bottom.value)}, ${itemLabel('foot', els.foot.value)}`,
                    badge: badgeClass
                };

                historyLog.unshift(newLog);
                if (historyLog.length > 5) historyLog.pop();

                // Save log
                localStorage.setItem('outfit_history', JSON.stringify(historyLog));
                renderHistory();
            }, 500);
        }

        function renderHistory() {
            els.history.innerHTML = '';
            if (historyLog.length === 0) {
                els.history.innerHTML = '<div style="color: var(--text-mut); font-size: 0.75rem; font-style: italic; padding: 0.5rem 0;">No previous outfit rating history found.</div>';
                return;
            }
            historyLog.forEach(log => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `
                    <div class="history-left">
                        <span style="font-weight: 700; color: #fff;">At ${log.temp}</span>
                        <span class="history-outfit">${log.outfit}</span>
                    </div>
                    <span class="history-badge ${log.badge}">${log.score}/10</span>
                `;
                els.history.appendChild(item);
            });
        }

        // Initialize history
        window.addEventListener('DOMContentLoaded', () => {
            renderHistory();
            updateAmbientGlow();
        });
    </script>
</body>
</html>
